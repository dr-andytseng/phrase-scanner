[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phrase-scanner"
version = "1.0.0"
description = "Crawl websites and search every accessible page for custom keywords or phrases; CLI and optional Flask web interface."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "phrase-scanner contributors" },
]
keywords = ["crawler", "seo", "content-audit", "keyword-search", "phrase-matching"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
urls = { Repository = "https://github.com/dr-andytseng/phrase-scanner" }
# Base dependencies: kept minimal — CLI only. Web support lives in the "web" extra.
# Lower bounds reflect versions available at the time this was written; they are
# permissive minimums, not pins. Only Python 3.9 (the version this was developed and
# tested on) is claimed to be supported.
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.9",
    "lxml>=4.6",
]

[project.optional-dependencies]
web = [
    "flask>=2.0",
]
dev = [
    "pytest>=7.0",
    "build>=0.10",
    "setuptools>=61",
]

[project.scripts]
phrase-scanner = "phrase_scanner_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phrase_scanner_app.web" = [
    "templates/*.html",
    "static/*.js",
    "static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
